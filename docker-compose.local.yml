services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
    restart: unless-stopped
